<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>Miaw — Character Design Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f1e8;
      --paper: #fcfaf4;
      --ink: #1a1a18;
      --ink-2: #3a3429;
      --ink-3: #6b6357;
      --line: #d8d2c4;
      --line-2: #ebe5d5;
      --accent: #1f2940;
      --oled-bezel: #0a1124;
      --oled-bezel-2: #060912;
      --warn: #c45a3a;
      --good: #5e8a4c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }
    code, .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.88em; }

    /* ── Page shell ─────────────────────────────────────────── */
    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 48px 56px 96px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding-bottom: 28px;
    }
    .page-head-left {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .brand-mark {
      width: 64px;
      height: 64px;
      border: 1.5px solid var(--ink);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      flex-shrink: 0;
    }
    .brand-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .page-head h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 42px;
      line-height: 1.05;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .page-head h1 .em { color: var(--ink-3); font-style: normal; margin: 0 4px; }
    .subtitle {
      margin: 0 0 6px;
      font-size: 17px;
      color: var(--ink-2);
      letter-spacing: -0.01em;
    }
    .note {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-3);
    }
    .page-head-right {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }
    .meta-chip {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 14px;
      min-width: 110px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .meta-chip span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .meta-chip strong {
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 0 0 56px;
    }

    /* ── Section heads ──────────────────────────────────────── */
    .section-head {
      margin: 72px 0 28px;
      max-width: 720px;
    }
    .section-head-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      max-width: none;
    }
    .section-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .section-head h2 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.15;
      margin: 0 0 6px;
      letter-spacing: -0.015em;
    }
    .section-head h2 em {
      font-style: italic;
      color: var(--ink-2);
    }
    .section-sub {
      margin: 0;
      font-size: 14px;
      color: var(--ink-3);
    }

    /* ── Hero ───────────────────────────────────────────────── */
    .hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 40px 44px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: start;
    }
    .hero-label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .kicker.dim { color: var(--ink-3); }

    .canvas-stage {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0;
    }
    .canvas-stage-inner {
      position: relative;
      display: inline-block;
    }
    .pin {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 3px var(--paper), 0 2px 6px rgba(0,0,0,0.15);
      z-index: 3;
      pointer-events: none;
    }
    .feature-legend {
      list-style: none;
      margin: 24px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
    }
    .feature-legend li {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-2);
    }
    .legend-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(2px);
    }
    .legend-label { line-height: 1.4; }

    .oled-1x-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .oled-1x-meta {
      display: flex;
      flex-direction: column;
    }

    .hero-canvas-wrap, .hero-oled-wrap { min-width: 0; }

    .oled-stack {
      display: flex;
      flex-direction: column;
      gap: 28px;
      align-items: flex-start;
    }
    .oled-cell {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .oled-cap {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      letter-spacing: 0.04em;
    }

    .hero-meta {
      margin-top: 32px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hero-meta-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: baseline;
      gap: 16px;
    }
    .hero-meta-k {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .hero-meta-v { font-size: 14px; color: var(--ink); }
    .hero-meta-v.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* ── State grid ─────────────────────────────────────────── */
    .state-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .state-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .state-card:hover {
      border-color: var(--ink-2);
      box-shadow: 0 8px 24px rgba(20, 20, 18, 0.06);
    }
    .state-card.is-active {
      border-color: var(--ink);
      box-shadow: 0 8px 24px rgba(20, 20, 18, 0.10), 0 0 0 1px var(--ink);
    }
    .state-card.is-active::after {
      content: 'INSPECTING';
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--ink);
      background: var(--bg);
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid var(--ink);
    }
    .state-card-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .state-card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
      letter-spacing: 0.06em;
    }
    .state-card-title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: -0.01em;
    }
    .state-card-screen {
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }
    .state-card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .state-desc {
      margin: 0;
      font-size: 13.5px;
      color: var(--ink-2);
      line-height: 1.45;
    }
    .state-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
    }
    .state-meta-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .state-meta-k {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .state-meta-v {
      font-size: 12.5px;
      color: var(--ink-2);
      line-height: 1.4;
    }
    .state-meta-v.mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
    .state-meta-row:nth-child(2) .state-meta-v { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }

    /* ── Spotify section ─────────────────────────────────────── */
    .spotify {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .spotify-hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 40px 44px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 48px;
      align-items: start;
    }
    .spotify-stage {
      position: relative;
      display: inline-block;
    }
    .spotify-pins {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .spotify-pins .pin {
      position: absolute;
    }
    .spotify-aside {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }
    .spotify-aside-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .spotify-legend {
      margin-top: 0;
      grid-template-columns: 1fr;
    }
    .song-picker {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 28px 22px;
    }
    .song-picker-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-2);
    }
    .song-picker-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .song-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: var(--ink);
      transition: background 0.15s, border-color 0.15s;
    }
    .song-row:hover { background: var(--bg); }
    .song-row.is-active {
      background: var(--bg);
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }
    .song-row-idx {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
    }
    .song-row-title {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .song-row-title strong {
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .song-row-title em {
      font-style: normal;
      font-size: 11.5px;
      color: var(--ink-3);
    }
    .song-row-dur {
      font-size: 11.5px;
      color: var(--ink-3);
    }

    .spotify-moments {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 28px 26px;
    }
    .spotify-moments-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
    }
    .spotify-moments-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      justify-items: center;
    }
    .moment-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .moment-meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .moment-label {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .moment-time {
      font-size: 11.5px;
      color: var(--ink-3);
    }

    .spotify-spec {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .spotify-spec-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
    }

    /* Active mode card (in hero aside) */
    .spotify-active-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .spotify-active-mode {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .spotify-active-label {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .spotify-active-tag {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .spotify-active-desc {
      margin: 0;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.45;
    }
    .spotify-active-anim {
      font-size: 11.5px;
      color: var(--ink-3);
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }

    /* Section head tight (sub-section) */
    .section-head-tight {
      margin: 40px 0 20px;
    }
    .section-head-tight h3 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 22px;
      line-height: 1.2;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    /* Mode grid (5 cards) */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }
    .mode-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      position: relative;
      min-width: 0;
    }
    .mode-card:hover {
      border-color: var(--ink-2);
      box-shadow: 0 8px 24px rgba(20, 20, 18, 0.06);
    }
    .mode-card.is-active {
      border-color: var(--ink);
      box-shadow: 0 8px 24px rgba(20, 20, 18, 0.10), 0 0 0 1px var(--ink);
    }
    .mode-card.is-active::after {
      content: 'PINNED';
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--ink);
      background: var(--bg);
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid var(--ink);
    }
    .mode-card .state-card-num {
      font-family: 'Fraunces', serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.01em;
      text-transform: lowercase;
    }
    .mode-card .state-card-screen {
      display: flex;
      justify-content: center;
    }
    .mode-card .state-desc {
      margin: 0;
      font-size: 12.5px;
      color: var(--ink-2);
      line-height: 1.4;
    }

    /* ── Specs ──────────────────────────────────────────────── */
    .specs { margin-top: 8px; }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    .spec-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
    }
    .spec-card-title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 18px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-2);
      letter-spacing: -0.01em;
    }
    .spec-list {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .spec-list > div {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
    }
    .spec-list dt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .spec-list dd {
      margin: 0;
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.4;
    }
    .spec-list dd code {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11.5px;
    }

    .specs-anim {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 28px 18px;
    }
    .specs-anim-head {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 18px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-2);
    }
    .anim-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px 36px;
    }
    .anim-row {
      display: grid;
      grid-template-columns: 36px 1fr 1.2fr;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 1px dotted var(--line-2);
      align-items: baseline;
    }
    .anim-row:nth-last-child(-n+2) { border-bottom: none; }
    .anim-row-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-3);
    }
    .anim-row-label { font-size: 13.5px; color: var(--ink); }
    .anim-row-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-2);
      text-align: right;
    }

    /* ── Foot ───────────────────────────────────────────────── */
    .page-foot {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .foot-left { display: flex; flex-direction: column; gap: 4px; }
    .foot-dim { font-size: 12.5px; color: var(--ink-3); }
    .foot-right {
      display: flex;
      gap: 10px;
      color: var(--ink-3);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    /* Smooth scaling for SVGs */
    svg { display: block; }
  </style>
